services:
    _defaults:
        autowire: true
        autoconfigure: true
    BugCatcher\Tests\App\:
        resource: '../'
        exclude:
            - '../config/'
            - '../Factory/'
            - '../Entity/'
            - '../src/Kernel.php'
            - '../src/KernelTestCase.php'
    BugCatcher\Command\PingCollectorCommand:
        arguments:
            $collectors:
                http: '@BugCatcher\Service\PingCollector\HttpPingCollector'
                messenger: '@BugCatcher\Service\PingCollector\MessengerCollector'
                always_ok: '@BugCatcher\Tests\App\Service\OkPingCollector'
                always_throw: '@BugCatcher\Tests\App\Service\ThrowCollector'

    # the test application has a record type of its own (RecordCron), so it owes the bundle a
    # batch delete that names its table - exactly the step docs/custom_record.md describes
    BugCatcher\Service\BatchRecordDeleteInterface: '@BugCatcher\Tests\App\Service\CronBatchRecordDeleteService'
