bug_catcher:
    logo: 'default'
    mcp:
        access_token: 'test-mcp-token'
        # the custom type is listed so the tools are exercised against a subtype of Record that is
        # not a RecordLog - which is the case the bundle got wrong before
        record_types:
            - BugCatcher\Entity\RecordLog
            - BugCatcher\Entity\RecordLogTrace
            - BugCatcher\Tests\App\Entity\RecordCron
    collectors:
        Http: http
        Messenger: messenger
        Cron 2: cron-v2
        None: none
    refresh_interval: 5
    dashboard_list_items:
        - BugCatcher\Entity\RecordLog
        - BugCatcher\Entity\RecordLogTrace
        - BugCatcher\Tests\App\Entity\RecordCron
    detail_components:
        BugCatcher\Entity\RecordLogTrace:
            - 'Detail:Header'
            - 'Detail:Title'
            - 'Detail:HistoryList'
            - 'Detail:StackTrace'
        BugCatcher\Entity\RecordLog:
            - 'Detail:Header'
            - 'Detail:Title'
            - 'Detail:HistoryList'
        BugCatcher\Tests\App\Entity\RecordCron:
            - 'Detail:Header'
            - 'Detail:Title'
            - 'Detail:HistoryList'
    roles:
        Admin: ROLE_ADMIN
        Developer: ROLE_DEVELOPER
        User: ROLE_USER
        Customer: ROLE_CUSTOMER
        Full Page Reload: ROLE__FULL_PAGE_RELOAD